name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    # Linux only: liam builds Linux images, and its runtime is io_uring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain named in rust-toolchain.toml on the first
      # cargo invocation, so there is nothing to pin twice.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The site's toolchain: pnpm from package.json's packageManager, Node from
      # site/.node-version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: ./scripts/task check

  # The one status check branch protection requires, so adding a job never means
  # editing a protection rule.
  required:
    name: required
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}"
            exit 1
          fi
